{% extends "base.html" %}
{% block title %}New User{% endblock %}
{% block content %}
<article style="max-width:420px;margin:4rem auto;">
  <h2>Add User</h2>
  {% if error %}<p class="stat-bad">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/users/new">
    <label>Username
      <input type="text" name="username" required minlength="3" autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required minlength="8">
    </label>
    <label>Confirm password
      <input type="password" name="confirm" required minlength="8">
    </label>
    <label>
      <input type="checkbox" name="is_admin">
      Admin (can manage users and see this panel)
    </label>
    <button type="submit">Create User</button>
  </form>
  <p><small><a href="/admin/users">Back to Manage Users</a></small></p>
</article>
{% endblock %}
