{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <div class="brand-mark">Y</div>
    <h2>Welcome back</h2>
    <p class="auth-sub">Log in to your Yourselfmedia Tracker dashboard.</p>
    {% if error %}<p class="stat-bad">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <label>Username
        <input type="text" name="username" required autofocus>
      </label>
      <label>Password
        <input type="password" name="password" required>
      </label>
      <button type="submit">Log in</button>
    </form>
    <p class="auth-footer"><small>Don't have an account? <a href="/register">Register</a></small></p>
  </div>
</div>
{% endblock %}
