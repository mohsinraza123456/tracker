{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <div class="brand-mark">Y</div>
    <h2>Create your account</h2>
    <p class="auth-sub">Get your own isolated workspace &mdash; free, no credit card.</p>
    {% if error %}<p class="stat-bad">{{ error }}</p>{% endif %}
    <form method="post" action="/register">
      <label>Username
        <input type="text" name="username" required minlength="3" autofocus>
      </label>
      <label>Password
        <input type="password" name="password" required minlength="8">
      </label>
      <label>Confirm password
        <input type="password" name="confirm" required minlength="8">
      </label>
      <button type="submit">Create account</button>
    </form>
    <p class="auth-footer"><small>Already have an account? <a href="/login">Log in</a></small></p>
  </div>
</div>
{% endblock %}
