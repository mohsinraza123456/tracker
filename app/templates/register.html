{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<article style="max-width:420px;margin:4rem auto;">
  <h2>Create an account</h2>
  {% if error %}<p class="stat-bad">{{ error }}</p>{% endif %}
  <form method="post" action="/register">
    <label>Username
      <input type="text" name="username" required minlength="3" autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required minlength="8">
    </label>
    <label>Confirm password
      <input type="password" name="confirm" required minlength="8">
    </label>
    <button type="submit">Register</button>
  </form>
  <p><small>Already have an account? <a href="/login">Log in</a></small></p>
</article>
{% endblock %}
